[project]
name = "app"
version = "0.1.0"
description = "OpenRunning FastAPI Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "tenacity>=8.2.3",
    "pydantic>2.0",
    "alembic>=1.12.1",
    "httpx>=0.25.1",
    "psycopg[binary]>=3.1.18",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.8.0",
    "pwdlib[argon2,bcrypt]>=0.2.0",
    "cryptography>=42.0.0",
    "fitparse>=1.2.0",
    "gpxpy>=1.6.0",
    "polyline>=2.0.0",
    "emails>=1.1.2",
    "jinja2>=3.1.4",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.2",
    "coverage>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = false
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]
